# =============================================================================
# Key distances - QMMM_preReactive system (3 replicas)
#
#   md-analyzer check -c analysis/qmmm_distances.yaml   <- RUN THIS FIRST
#   md-analyzer run   -c analysis/qmmm_distances.yaml
#
# Translates the 11 distances of mc_distances.yaml into MDAnalysis selections,
# measuring them directly on the trajectory (rather than on the cpptraj
# .dat), with R32 -> resid 414 as indicated.
#
# IMPORTANT - READ THIS BEFORE RUNNING:
# The residue numbering was verified against a copy of
# earp_efp_tdp-r_ok.prmtop found in another folder (Metadyn/),
# not exactly the one in QMMM_preReactive/. With that copy:
#
#   CONFIRMED (same resid, residue type and correct atoms):
#     20 ASP (OD1/OD2), 16 ASP (OD1), 115 TYR (OH/HH), 272 SER (OG/HG),
#     89 GLU (OE1/OE2), 249 PHE, 255 PHE, y 414 ARG (HH11/HH12/HH21/HH22,
#     NE/HE, NH1/NH2) tal como confirmaste para R32->R414.
#
#   NOT CONFIRMED - in that copy the resid is not the expected type:
#     - resid 265 is ALA, not ARG (there is an ARG at 268, three positions further)
#     - resid 55  is ASP, not LYS (there is an ARG at 50, no nearby LYS)
#     - resid 36  is GLY, not LYS (there is an ARG at 33, no nearby LYS)
#     - resid 114 is GLU (correct), but the atom "OE3" does not exist in Glu
#       (only OE1/OE2) -> mode:min over OE1 and OE2 is used
#
#   The most likely explanation is that the copy used for verification (from
#   the Metadyn/ folder) has an insertion/deletion of a few residues around
#   that region relative to the real QMMM_preReactive/ prmtop, so in YOUR
#   topology resids 265/55/36 may well be correct.
#   They were NOT corrected blindly (hitting the wrong resid is worse than
#   a failing selection). They are left as in mc_distances.yaml.
#
#   Run 'md-analyzer check' first: if any of those three fails or finds
#   a residue of the wrong type, adjust the resid here.
# =============================================================================

system:
  topology: ../QMMM_preReactive/QMMM_restricted/earp_efp_tdp-r_ok.prmtop
  replicas:
    rep1: [../QMMM_preReactive/QMMM_restricted/qmmm-100ps.nc]
    rep2: [../QMMM_preReactive/QMMM_restricted2/qmmm-100ps.nc]
    rep3: [../QMMM_preReactive/QMMM_restricted3/qmmm-100ps.nc]
  time:
    dt: null                  # read from the trajectory
    unit: ps
  frames:
    start: 0
    stop: null
    stride: 1                 # raise this if 3x100 ps is too heavy
  align:
    enabled: false             # distances do not need it

output:
  directory: results_qmmm_distances
  formats: [png, pdf]
  dpi: 300

selections:
  # -- confirmed --
  D20_OD1:   "resid 20 and name OD1"
  D20_OD2:   "resid 20 and name OD2"
  D16_OD1:   "resid 16 and name OD1"
  Y115_OH:   "resid 115 and name OH"
  S272_OG:   "resid 272 and name OG"
  E89_OE2:   "resid 89 and name OE2"
  R414_HH11: "resid 414 and name HH11"
  R414_HH12: "resid 414 and name HH12"
  R414_HH21: "resid 414 and name HH21"
  R414_HH22: "resid 414 and name HH22"
  TRH_O2P:   "resname TRH and name O2P"
  TRH_O3P:   "resname TRH and name O3P"
  TRH_O4P:   "resname TRH and name O4P"
  TRH_ALL:   "resname TRH"
  PHE249_RING: "resid 249 and name CG CD1 CD2 CE1 CE2 CZ"
  PHE255_RING: "resid 255 and name CG CD1 CD2 CE1 CE2 CZ"

  # -- NOT CONFIRMED: check these before trusting them --
  R265_HH21: "resid 265 and name HH21"
  R265_HE:   "resid 265 and name HE"
  K55_NZ:    "resid 55 and name NZ"
  E114_OE:   "resid 114 and name OE1 OE2"   # the ".dat" OE3 does not exist; min of the two
  K36_NZ:    "resid 36 and name NZ"

analyses:

  distances:
    enabled: true
    bins: 60
    kde: true
    pbc: true
    facet: true                # a single multi-panel figure, as in mc_distances
    normalization: density
    pairs:
      - name: d_D20OD1_R414HH12
        atoms: [D20_OD1, R414_HH12]
        label: "D20:OD1 - R414:HH12"
        threshold: 2.5

      - name: d_D20OD2_R414HH22
        atoms: [D20_OD2, R414_HH22]
        label: "D20:OD2 - R414:HH22"
        threshold: 2.5

      - name: d_D16OD1_R414HH21
        atoms: [D16_OD1, R414_HH21]
        label: "D16:OD1 - R414:HH21"
        threshold: 2.5

      - name: d_Y115OH_R414HH11
        atoms: [Y115_OH, R414_HH11]
        label: "Y115:OH - R414:HH11"
        threshold: 2.5

      - name: d_TRH_O2P_S272OG
        atoms: [TRH_O2P, S272_OG]
        label: "TRH:O2P - S272:OG"
        threshold: 3.5

      - name: d_E89OE2_K55NZ
        atoms: [E89_OE2, K55_NZ]
        label: "89:OE2 - K55:NZ"          # K55 unconfirmed, see the warning above

      - name: d_E114OE_K36NZ
        atoms: [E114_OE, K36_NZ]
        mode: min
        label: "114:OE1/OE2 - K36:NZ"     # 114 and K36 unconfirmed, see the warning above

      # -- unconfirmed (resid 265, see the warning above) --
      - name: d_TRH_O4P_R265HH21
        atoms: [TRH_O4P, R265_HH21]
        label: "TRH:O4P - R265:HH21"
        threshold: 2.5

      - name: d_TRH_O3P_R265HE
        atoms: [TRH_O3P, R265_HE]
        label: "TRH:O3P - R265:HE"
        threshold: 2.5

      # -- ligand-Phe distances: how they were defined in the original .dat
      # is unknown (COM-COM of the whole residue? ring centroid?).
      # Here the centre of mass of the whole ligand is used against the
      # aromatic ring centroid of each Phe; adjust if the cpptraj script
      # used another definition.
      - name: d_TRH_F249
        atoms: [TRH_ALL, PHE249_RING]
        mode: com
        label: "TRH (COM) - F249 (ring)"

      - name: d_TRH_F255
        atoms: [TRH_ALL, PHE255_RING]
        mode: com
        label: "TRH (COM) - F255 (ring)"

  free_energy_maps:
    enabled: true
    temperature: 300.0
    maps:
      - name: fes_OD1_OD2         # bidentate vs monodentate salt bridge
        x: d_D20OD1_R414HH12
        y: d_D20OD2_R414HH22
        bins: 60
        free_energy: true
        max_energy: 3.0

report:
  enabled: true
  formats: [markdown, html]
  title: "QMMM preReactive - key distances (3 replicas)"
